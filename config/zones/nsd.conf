server:
  ip-address: 10.53.0.5
  zonesdir: /etc/lab/zones
  database: ""
  zonelistfile: /var/lib/nsd/zone.list
  xfrdfile: /var/lib/nsd/xfrd.state

remote-control:
  control-enable: no

zone:
  name: "."
  zonefile: root.zone
  # client-recursive keeps a local copy of the root zone (RFC 8806)
  provide-xfr: 10.53.0.0/24 NOKEY

zone:
  name: "test"
  zonefile: test.zone
