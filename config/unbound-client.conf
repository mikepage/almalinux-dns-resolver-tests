# Local caching resolver on the VM.
# Forwards to the provider resolvers. If both fail, forward-first makes unbound
# resolve itself from the root. If that fails too, serve-expired answers from stale cache.
server:
  interface: 127.0.0.1
  access-control: 127.0.0.0/8 allow
  do-ip6: no
  # Lab only: the fake root is unsigned. In production keep the default validator + trust anchor.
  module-config: "iterator"
  chroot: ""
  root-hints: /etc/lab/zones/root.hints
  # unbound answers NXDOMAIN for test. by default (RFC 6761)
  local-zone: "test." nodefault

  # Default 120000. With dead forwarders unbound backs off up to this RTT before
  # forward-first falls back to recursion: 5 min of failed lookups. 500 makes it <1s.
  infra-cache-max-rtt: 500
  # Default 900. A forwarder marked dead stays dead this long; after that unbound tries
  # it again. 60 means it returns to the provider resolvers within ~1 min.
  infra-host-ttl: 60

  prefetch: yes
  serve-expired: yes
  serve-expired-ttl: 86400
  serve-expired-client-timeout: 1800

  verbosity: 1
  use-syslog: no
  logfile: ""

forward-zone:
  name: "."
  forward-addr: 10.53.0.11
  forward-addr: 10.53.0.12
  forward-first: yes

remote-control:
  control-enable: no
