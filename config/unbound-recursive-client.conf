# Local resolver on the VM doing full recursion itself. No forwarders, so it does not
# depend on the provider's resolvers at all. Keeps a local copy of the root zone
# (RFC 8806). infra-* settings stay at their defaults: they only matter for forwarders.
server:
  interface: 127.0.0.1
  access-control: 127.0.0.0/8 allow
  do-ip6: no
  # Lab only: the fake root is unsigned. In production keep the default validator + trust anchor.
  module-config: "iterator"
  chroot: ""
  root-hints: /etc/lab/zones/root.hints
  # unbound answers NXDOMAIN for test. by default (RFC 6761)
  local-zone: "test." nodefault

  prefetch: yes
  serve-expired: yes
  serve-expired-ttl: 86400
  serve-expired-client-timeout: 1800

  verbosity: 1
  use-syslog: no
  logfile: ""

auth-zone:
  name: "."
  primary: 10.53.0.5
  fallback-enabled: yes
  for-downstream: no
  for-upstream: yes

remote-control:
  control-enable: no
