# The intuitive config: provider resolvers, public resolver as FallbackDNS.
# Note: resolved only uses FallbackDNS when no other DNS server is known at all.
[Resolve]
DNS=10.53.0.11 10.53.0.12
FallbackDNS=10.53.0.53
DNSSEC=no
DNSOverTLS=no
Cache=yes
# Serve stale cache when upstream fails. Needs systemd 254+: ignored on EL9 (252), used on EL10 (257).
StaleRetentionSec=1800
DNSStubListener=yes
LLMNR=no
MulticastDNS=no
