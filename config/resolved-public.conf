# Public resolver as the third DNS= entry, so resolved actually fails over to it.
[Resolve]
DNS=10.53.0.11 10.53.0.12 10.53.0.53
FallbackDNS=
DNSSEC=no
DNSOverTLS=no
Cache=yes
# Serve stale cache when upstream fails. Needs systemd 254+: ignored on EL9 (252), used on EL10 (257).
StaleRetentionSec=1800
DNSStubListener=yes
LLMNR=no
MulticastDNS=no
