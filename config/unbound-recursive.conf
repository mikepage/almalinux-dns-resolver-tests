# Provider resolvers and the public resolver: plain recursive unbound.
server:
  interface: 0.0.0.0
  access-control: 10.53.0.0/24 allow
  do-ip6: no
  module-config: "iterator"
  chroot: ""
  root-hints: /etc/lab/zones/root.hints
  # unbound answers NXDOMAIN for test. by default (RFC 6761)
  local-zone: "test." nodefault
  verbosity: 1
  use-syslog: no
  logfile: ""

remote-control:
  control-enable: no
